<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Cambiar Contraseña</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mensajes.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="login-container">

    <div class="logos">
      <img src="img/TECNM.png" class="logo-left">
      <img src="img/escudo.png" class="logo-right">
    </div>

    <div class="logo-center">
      <img src="img/Burrito.png">
    </div>

    <h2>Laboratorio de Electrónica Analógica</h2>

    <form id="formCambiar">
      <div class="input-container">
        <i class="fa fa-user"></i>
        <input type="text" id="usuario" name="usuario" placeholder="Número de Control"
        maxlength="8"
        inputmode="numeric"
        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
        required>
      </div>

      <div class="input-container">
        <i class="fa fa-lock"></i>
        <input type="password" id="passwordActual" name="passwordActual" placeholder="Contraseña Actual" required>
      </div>

      <div class="input-container">
        <i class="fa fa-lock"></i>
        <input type="password" id="passwordNueva" name="passwordNueva" placeholder="Contraseña Nueva" required>
      </div>

      <button type="button" onclick="cambiarContrasena()">Cambiar Contraseña</button>
    </form>
  </div>

  <script src="js/CambiarContrasena.js"></script>
  <script src="js/mensajes.js"></script>
</body>
</html>
